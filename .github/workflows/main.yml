          set -e -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q -o gradle.zip
          if ! ./gradle-8.4/bin/gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
