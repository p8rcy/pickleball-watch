          EOF_B64
          mkdir -p ~/.android
          cp -f app/debug.keystore ~/.android/debug.keystore
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          fi
          set -e -o pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q -o gradle.zip
          if ! ./gradle-8.4/bin/gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log; then
            echo "### Build Error Log" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            grep -E "(^e: |FAILURE:|What went wrong|AAPT:)" -A 8 build.log >> "$GITHUB_STEP_SUMMARY" || tail -n 40 build.log >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p app/build/outputs/apk/debug
          cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ready-to-Install Watch & Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: DinkScore-WearOS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
